image: python:3.9

cache:
  paths:
    - ~/.cache/pip

stages:
 - build
 - deploy

minify-js-prod:
  image: node:24
  stage: build 
  script:
    - npm install uglify-js sass @node-minify/cli@6.2.0 @node-minify/html-minifier@6.2.0 -g
    # same script as the Dockerfile: it reads /public and writes /output
    - mkdir -p "$CI_PROJECT_DIR/output"
    - ln -s "$CI_PROJECT_DIR/public" /public
    - ln -s "$CI_PROJECT_DIR/output" /output
    - sh docker-script.sh
  artifacts:
    paths:
      - output

build-firmware:
  stage: deploy
  image: espressif/idf:v6.0
  script:
    - cp -r output/. ./data/www/
    - idf.py build
    - python $IDF_PATH/components/spiffs/spiffsgen.py 0x100000 data spiffs.bin
    - mv build/badge-firmware.bin firmware.bin
    - mv build/partition_table/partition-table.bin partitions.bin
    - mv build/bootloader/bootloader.bin bootloader.bin
  artifacts:
    paths:
      - bootloader.bin
      - partitions.bin
      - firmware.bin
      - spiffs.bin
  # only:
  #   - development
